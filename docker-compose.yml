services:
  # Rozmowy + statystyki (tokeny, tok/s, zużycie energii/wody) - jedno źródło
  # prawdy zamiast plików JSONL na dysku. Bez rezerwacji GPU, więc zawsze
  # startuje - nie jest za żadnym profilem.
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aichat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-aichat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Kontener ollama + rezerwacja GPU nvidia to CAŁKOWICIE OPCJONALNA ścieżka
  # dla hostów z kartą NVIDIA - stąd `profiles: [gpu]`. Bez aktywnego profilu
  # `docker compose up` w ogóle nie próbuje tworzyć/startować tego serwisu,
  # więc na hoście bez GPU (np. mini-PC na CPU) redeploy się nie wywala na
  # "could not select device driver nvidia" (twardy błąd `docker compose up`,
  # nie tylko utknięcie w "Created" - stary komentarz to bagatelizował).
  #
  # Żeby faktycznie z niego korzystać na hoście z NVIDIA: dodaj do `.env`
  #   COMPOSE_PROFILES=gpu
  # (Compose czyta `.env` automatycznie, więc podłapie to też redeploy.sh).
  #
  # Bez GPU: uruchom Ollamę natywnie na hoście i wskaż na nią backend przez
  # docker-compose.override.yml:
  #   services.backend.environment: OLLAMA_URL=http://172.17.0.1:11434
  # (172.17.0.1 to domyślny adres bramy mostka Dockera - adres hosta widziany
  # z wnętrza kontenerów), a samą Ollamę uruchom z OLLAMA_HOST=172.17.0.1:11434
  # (albo 0.0.0.0), żeby przyjmowała połączenia spoza loopbacku.
  ollama:
    image: ollama/ollama
    container_name: ollama
    profiles: ["gpu"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1      # szybsza uwaga, mniejsze zużycie pamięci
      - OLLAMA_KV_CACHE_TYPE=q4_0     # mały cache KV = więcej VRAM na warstwy modelu = szybciej
      - OLLAMA_KEEP_ALIVE=-1          # trzymaj model w RAM, bez przeładowań między pytaniami
      - OLLAMA_NUM_PARALLEL=1         # cały (wolny) CPU na jedno zapytanie naraz
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    container_name: ai-backend
    environment:
      # Domyślnie wskazuje na dockerowy serwis `ollama` (profil "gpu", patrz
      # wyżej) - na hostach bez GPU nadpisz w docker-compose.override.yml.
      - OLLAMA_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-huihui_ai/qwen2.5-abliterate:7b}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD}
      - ADMIN_PIN=${ADMIN_PIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aichat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aichat}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    # UWAGA: celowo bez `depends_on: - ollama` - ten serwis jest za profilem
    # "gpu" i Compose twardo błądzi ("service depends on undefined service"),
    # jeśli nieprofilowany serwis zależy od profilowanego, a profil nie jest
    # aktywny. Backend i tak łączy się z Ollamą leniwie przez HTTP (OLLAMA_URL),
    # kolejność startu kontenerów nie ma tu znaczenia.
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
